name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Run tests
        run: make test
      - name: Run tests with sanitizers
        if: runner.os == 'Linux'
        run: |
          make clean
          make test CXXFLAGS="-std=c++17 -g -O1 -Wall -Wextra -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer"
